<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Services Portal - Authentication Sign In</title>
    
    <!-- FIXED RELATIVE PATHS -->
    <link rel="stylesheet" href="../../assets/styles/theme.css">
    <link rel="stylesheet" href="./auth.css"> <!-- Looks in the same folder -->
</head>
<body>


    <div class="auth-card">
        <div class="auth-brand">
            <span class="logo-badge">UOK</span>
            <h1 class="auth-title">Campus Services Portal</h1>
            <p class="auth-subtitle">University Identity & Access Management Gateway</p>
        </div>

        <div id="login-error-alert" style="display: none; background: #FEE2E2; border: 1px solid #FCA5A5; color: #B91C1C; padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; margin-bottom: 16px;"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="login-email">Registered Email Address</label>
                <input type="email" id="login-email" class="form-control" placeholder="e.g. student@kln.ac.lk" required>
            </div>

            <div class="form-group">
                <div class="password-label-row">
                    <label class="form-label label-no-margin" for="login-password">Password</label>
                    <button type="button" id="btn-forgot-password" class="link-btn forgot-password-link">Forgot password?</button>
                </div>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" id="btn-login" class="btn btn-primary login-submit-btn">
                Sign In to Portal Account →
            </button>
        </form>

        <div class="register-redirect-container">
            Don't have an account? <a href="./register.html" class="register-link">Register with Student Master List</a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-password-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">🔐 Request Password Reset</h3>
                <button id="btn-close-modal" class="modal-close">&times;</button>
            </div>
            <p class="modal-instruction-text">
                Enter your registered email address to receive a single-use time-limited password reset token.
            </p>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="reset-email" class="form-control" placeholder="student@kln.ac.lk">
            </div>
            <button id="btn-request-token" class="btn btn-primary full-width-btn">
                Generate Reset Token (POST /api/auth/forgot-password)
            </button>

            <div id="reset-step-2" class="modal-step-hidden">
                <div class="form-group">
                    <label class="form-label">Password Reset Token</label>
                    <input type="text" id="reset-token" class="form-control" placeholder="Paste generated token">
                </div>
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" id="reset-new-password" class="form-control" placeholder="Enter new strong password">
                </div>
                <button id="btn-submit-reset" class="btn btn-primary full-width-btn">
                    Update Password (POST /api/auth/reset-password)
                </button>
            </div>
        </div>
    </div>

    <!-- Relative Script File Path Adaptations -->
    <script src="../../core/js/toast.service.js"></script>
    <script src="../../core/js/api.service.js"></script>
    <script src="../../core/js/auth.service.js"></script>
    <script src="../../core/js/theme.service.js"></script>
    
    <!-- Local relative link connection -->
    <script src="./login.js"></script>
</body>
</html>
