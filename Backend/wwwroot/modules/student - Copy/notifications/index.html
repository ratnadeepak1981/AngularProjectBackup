<!DOCTYPE html>
<html lang="en" data-theme="oxford-navy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Notifications - Campus Services Portal</title>
    <link rel="stylesheet" href="../../../assets/styles/theme.css">
    <link rel="stylesheet" href="../../../assets/styles/main.css">
    <link rel="stylesheet" href="notifications.css">
</head>
<body>
    <header></header>

    <div class="app-container">
        <aside></aside>

        <main class="app-content">
            <div class="card-header">
                <div>
                    <h1 class="card-title">🔔 Student System Notifications Feed</h1>
                    <p class="text-secondary">Real-time alerts generated by housing approvals, lab holds, event registrations, and fee assignments.</p>
                </div>
            </div>

            <!-- Notifications Feed Card -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Notification Feed</h3>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-sm btn-outline" onclick="StudentNotificationsModule.filterFeed('all')">All Alerts</button>
                        <button class="btn btn-sm btn-outline" onclick="StudentNotificationsModule.filterFeed('unread')">Unread Only</button>
                    </div>
                </div>

                <div id="notifications-feed-container">
                    <p class="text-secondary">Loading system notification feed...</p>
                </div>
            </div>
        </main>
    </div>

    <footer></footer>

    <script src="../../../core/js/api.service.js"></script>
    <script src="../../../core/js/auth.service.js"></script>
    <script src="../../../core/js/toast.service.js"></script>
    <script src="../../../core/js/theme.service.js"></script>
    <script src="../../../core/js/app.js"></script>
    <script src="notifications.js"></script>
</body>
</html>
