<div>
  @if (label()) {
    <label class="block text-2xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5 flex items-center gap-1">
      <span>📅</span> {{ label() }}
    </label>
  }
  <input
    type="date"
    [value]="selectedDate()"
    [min]="minDate()"
    [disabled]="disabled()"
    (change)="onDateInput($event)"
    class="w-full text-xs font-semibold px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-shadow cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
  />
</div>
