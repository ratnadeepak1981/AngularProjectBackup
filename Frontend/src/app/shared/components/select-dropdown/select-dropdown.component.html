<div class="relative w-full text-left">
  <!-- Field Label -->
  @if (label()) {
    <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
      {{ label() }}
      @if (required()) {
        <span class="text-rose-500 font-bold">*</span>
      }
    </label>
  }

  <!-- Trigger Button -->
  <button
    type="button"
    (click)="toggleOpen($event)"
    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 flex items-center justify-between text-xs font-semibold hover:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all cursor-pointer shadow-2xs"
  >
    <div class="flex items-center gap-2 truncate">
      @if (selectedOption()?.icon) {
        <span>{{ selectedOption()?.icon }}</span>
      } @else if (icon()) {
        <span>{{ icon() }}</span>
      }
      <span [ngClass]="{ 'text-slate-400 dark:text-slate-500 font-normal': !selectedOption() }">
        {{ selectedOption() ? selectedOption()?.label : placeholder() }}
      </span>
    </div>
    <span class="text-slate-400 text-2xs transition-transform" [ngClass]="{ 'rotate-180': isOpen() }">▾</span>
  </button>

  <!-- Options Popover Card -->
  @if (isOpen()) {
    <div
      (click)="$event.stopPropagation()"
      class="absolute left-0 top-full mt-1.5 w-full bg-white dark:bg-slate-900 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800 p-1.5 z-[100] max-h-56 overflow-y-auto space-y-1 text-xs animate-fade-in"
    >
      @for (opt of options(); track opt.value) {
        <button
          type="button"
          (click)="selectOption(opt, $event)"
          class="w-full p-2.5 rounded-lg flex items-center justify-between text-left font-semibold transition-colors cursor-pointer"
          [ngClass]="{
            'bg-blue-50 dark:bg-blue-950/80 text-blue-800 dark:text-blue-200': selectedValue() === opt.value,
            'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800': selectedValue() !== opt.value
          }"
        >
          <div class="flex items-center gap-2.5 truncate">
            @if (opt.icon) {
              <span class="text-sm">{{ opt.icon }}</span>
            }
            <div>
              <p class="truncate font-bold">{{ opt.label }}</p>
              @if (opt.description) {
                <p class="text-2xs text-slate-400 dark:text-slate-500 font-normal truncate">{{ opt.description }}</p>
              }
            </div>
          </div>

          @if (selectedValue() === opt.value) {
            <span class="text-blue-600 dark:text-blue-400 font-bold text-2xs">✓</span>
          }
        </button>
      }
    </div>
  }
</div>
