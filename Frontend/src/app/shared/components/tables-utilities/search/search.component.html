<div class="relative w-full">
  <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
    🔍
  </span>
  <input
    type="text"
    [value]="searchTerm()"
    (input)="onInput($any($event.target).value)"
    [placeholder]="placeholder()"
    class="w-full pl-9 pr-8 py-2 text-xs sm:text-sm bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900 dark:text-white transition-colors"
  />
  @if (searchTerm()) {
    <button
      type="button"
      (click)="onClear()"
      class="absolute inset-y-0 right-0 flex items-center pr-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-white cursor-pointer"
      title="Clear search"
    >
      ✕
    </button>
  }
</div>
