<div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-2xl p-5 shadow-sm border border-slate-200 dark:border-slate-800 transition-all duration-300 hover:shadow-md">
  <div class="flex items-center justify-between gap-3">
    <div class="space-y-1">
      <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
        {{ title() }}
      </div>
      @if (isLoading()) {
        <div class="h-7 w-28 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-lg mt-1"></div>
      } @else {
        <div [class]="getValueColorClass()" class="text-2xl font-extrabold tracking-tight font-mono">
          {{ amount() }}
        </div>
      }
    </div>

    <div [class]="getIconBadgeClass()" class="w-11 h-11 rounded-2xl flex items-center justify-center text-lg shadow-2xs flex-shrink-0">
      {{ icon() }}
    </div>
  </div>
</div>
