<div class="group/card relative bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-2xl p-5 border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between h-full">
  <!-- Top Section: Metric Details & Medium Meaningful Icon Badge -->
  <div class="flex items-start justify-between gap-3">
    <div class="space-y-1 min-w-0 flex-1">
      <span class="text-[11px] font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 block truncate">
        {{ title() }}
      </span>
      <div class="text-xl sm:text-2xl font-bold tracking-tight leading-tight" [ngClass]="getValueColorClass()">
        @if (isLoading()) {
          <span class="animate-pulse inline-block w-8 h-6 bg-slate-200 dark:bg-slate-800 rounded-lg"></span>
        } @else {
          {{ value() }}
        }
      </div>
    </div>

    <!-- Medium Meaningful Icon Badge Container (48px) -->
    <div
      class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl shadow-xs transition-transform duration-200 group-hover/card:scale-105 shrink-0"
      [ngClass]="getIconBadgeClass()"
    >
      <span>{{ icon() }}</span>
    </div>
  </div>

  <!-- Bottom Section: Enhanced Interactive Action Button -->
  @if (linkRoute() && linkText()) {
    <div class="mt-4 pt-3 border-t border-slate-200 dark:border-slate-800">
      <a
        [routerLink]="linkRoute()"
        class="group/link w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800/80 hover:bg-blue-50 dark:hover:bg-blue-950/50 text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 text-xs font-semibold border border-slate-200 dark:border-slate-700 hover:border-blue-300 dark:hover:border-blue-800 transition-all flex items-center justify-between shadow-2xs"
      >
        <span>{{ linkText() }}</span>
        <span class="text-blue-500 font-bold transition-transform duration-150 group-hover/link:translate-x-1">
          &rarr;
        </span>
      </a>
    </div>
  }
</div>
