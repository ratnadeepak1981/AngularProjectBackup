<div
  (click)="onClick()"
  class="group relative bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-2xl p-5 border border-slate-200/80 dark:border-slate-800 hover:border-blue-500/50 dark:hover:border-blue-500/50 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between h-full"
>
  <!-- Card Header with Icon Badge & Parameter Count -->
  <div>
    <div class="flex items-center justify-between gap-3 mb-3">
      <div
        [ngClass]="{
          'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800': card().colorTheme === 'emerald',
          'bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800': card().colorTheme === 'blue',
          'bg-purple-50 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 border-purple-200 dark:border-purple-800': card().colorTheme === 'purple',
          'bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 border-amber-200 dark:border-amber-800': card().colorTheme === 'amber',
          'bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border-rose-200 dark:border-rose-800': card().colorTheme === 'rose',
          'bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border-indigo-200 dark:border-indigo-800': card().colorTheme === 'indigo',
          'bg-slate-100 dark:bg-slate-800/80 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700': card().colorTheme === 'slate'
        }"
        class="w-11 h-11 rounded-xl border flex items-center justify-center text-xl font-bold shadow-2xs group-hover:scale-110 transition-transform duration-200"
      >
        <span>{{ card().icon }}</span>
      </div>

      <span class="text-2xs font-bold px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
        {{ card().settingsCount }} Parameters
      </span>
    </div>

    <!-- Title & Description -->
    <h3 class="text-sm font-bold text-slate-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
      {{ card().title }}
    </h3>
    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">
      {{ card().description }}
    </p>

    <!-- Sub-Setting Badges Summary -->
    <div class="mt-3 flex flex-wrap gap-1.5">
      @for (item of card().summaryItems; track item) {
        <span class="text-3xs font-semibold px-2 py-0.5 rounded-md bg-slate-50 dark:bg-slate-800/60 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700/60 flex items-center gap-1">
          <span class="w-1 h-1 rounded-full bg-blue-500"></span>
          {{ item }}
        </span>
      }
    </div>
  </div>

  <!-- Card Action Footer -->
  <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs font-bold text-blue-600 dark:text-blue-400 group-hover:text-blue-700 dark:group-hover:text-blue-300">
    <span class="flex items-center gap-1.5">
      <span>⚙️</span> Configure Settings
    </span>
    <span class="group-hover:translate-x-1.5 transition-transform duration-200">➔</span>
  </div>
</div>
