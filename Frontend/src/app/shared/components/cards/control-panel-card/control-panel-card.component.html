<div
  (click)="onClick()"
  class="group relative bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-xl p-3.5 border border-slate-200/90 dark:border-slate-800 hover:border-blue-500/50 dark:hover:border-blue-500/50 shadow-xs hover:shadow-md transition-all duration-200 cursor-pointer flex flex-col justify-between h-full"
>
  <!-- Card Header with Icon Badge -->
  <div>
    <div class="flex items-center justify-between gap-2.5 mb-2">
      <div
        [ngClass]="{
          'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800': card().colorTheme === 'emerald',
          'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-200 border-blue-300 dark:border-blue-800': card().colorTheme === 'blue',
          'bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-200 border-purple-300 dark:border-purple-800': card().colorTheme === 'purple',
          'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-800': card().colorTheme === 'amber',
          'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-800': card().colorTheme === 'rose',
          'bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-200 border-indigo-300 dark:border-indigo-800': card().colorTheme === 'indigo',
          'bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-200 border-slate-300 dark:border-slate-700': card().colorTheme === 'slate'
        }"
        class="w-9.5 h-9.5 rounded-lg border flex items-center justify-center text-base font-bold shadow-2xs group-hover:scale-105 transition-transform"
      >
        <span>{{ card().icon }}</span>
      </div>

      <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-600">
        {{ card().settingsCount }} Parameters
      </span>
    </div>

    <!-- Title & Description (High Contrast Dark Slate) -->
    <h3 class="text-xs font-extrabold text-slate-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
      {{ card().title }}
    </h3>
    <p class="text-[11px] font-medium text-slate-700 dark:text-slate-200 mt-1 line-clamp-2 leading-snug">
      {{ card().description }}
    </p>

    <!-- Sub-Setting Badges Summary (Bold Dark Badges) -->
    <div class="mt-2.5 flex flex-wrap gap-1">
      @for (item of card().summaryItems; track item) {
        <span class="text-[9px] font-bold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-800/80 text-slate-800 dark:text-slate-100 border border-slate-300 dark:border-slate-600">
          {{ item }}
        </span>
      }
    </div>
  </div>

  <!-- Card Action Footer -->
  <div class="mt-3 pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-[11px] font-extrabold text-blue-700 dark:text-blue-300">
    <span class="flex items-center gap-1">
      <span>⚙️</span> Manage Category Settings
    </span>
    <span class="group-hover:translate-x-1 transition-transform">➔</span>
  </div>
</div>
