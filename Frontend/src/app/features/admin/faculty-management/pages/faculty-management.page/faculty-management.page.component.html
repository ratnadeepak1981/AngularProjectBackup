<div class="space-y-6">
  <!-- Reusable App Page Header Component -->
  <app-page-header
    [icon]="'🎓'"
    [title]="'University Faculties Master Directory'"
    [description]="'Manage academic faculties, codes, and cross-module student dependency safety checks.'"
  >
    <div class="flex items-center gap-2">
      <app-action-button
        label="Add New Faculty"
        icon="plus"
        variant="primary"
        tooltip="Add new university academic faculty"
        (btnClick)="openCreateModal()"
      ></app-action-button>

      <app-action-button
        label="Refresh Catalog"
        icon="refresh"
        variant="secondary"
        tooltip="Reload faculty directory"
        (btnClick)="loadFaculties()"
      ></app-action-button>
    </div>
  </app-page-header>

  <!-- Search Filter Bar -->
  <div class="bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-4 transition-colors">
    <div class="flex flex-col sm:flex-row items-center gap-3">
      <div class="relative flex-1 w-full">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
          🔍
        </span>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search by Faculty Name or Faculty Code..."
          class="w-full pl-9 pr-4 py-2 text-sm bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900 dark:text-white"
        />
      </div>

      <div class="text-xs text-slate-500 dark:text-slate-400 whitespace-nowrap font-medium">
        Showing {{ displayFaculties().length }} of {{ faculties().length }} total faculties
      </div>
    </div>
  </div>

  <!-- Reusable Data Table Component for Faculties Master -->
  <app-data-table
    [columns]="tableColumns"
    [data]="displayFaculties()"
    [totalRecords]="displayFaculties().length"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [isLoading]="isLoading()"
    [sortColumn]="sortColumn()"
    [sortDirection]="sortDirection()"
    [sortIconStyle]="'svg-arrows'"
    [emptyMessage]="'No university faculties found matching search criteria.'"
    (sortChange)="onSortChange($event)"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  >
    <ng-template #cellActions let-row>
      @if (row.statusText === 'Active') {
        <app-action-button
          label="Deactivate"
          icon="trash"
          variant="danger"
          size="sm"
          tooltip="Deactivate faculty"
          (btnClick)="openDeactivateModal(row)"
        ></app-action-button>
      } @else {
        <app-action-button
          label="Reactivate Faculty"
          icon="refresh"
          variant="success"
          size="sm"
          tooltip="Reactivate faculty"
          (btnClick)="reactivateFaculty(row)"
        ></app-action-button>
      }
    </ng-template>
  </app-data-table>
</div>

<!-- CREATE NEW FACULTY MODAL -->
@if (isCreateModalOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm animate-fade-in">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-100 flex flex-col space-y-4">
      <!-- Header -->
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2">
          <span class="text-xl">🏛️</span>
          <h3 class="text-base font-bold text-slate-900 dark:text-white">
            Add New Academic Faculty
          </h3>
        </div>
        <button
          type="button"
          (click)="closeCreateModal()"
          class="text-slate-400 hover:text-slate-600 dark:hover:text-white text-lg font-bold cursor-pointer"
        >
          ✕
        </button>
      </div>

      <!-- Form Body -->
      <div class="space-y-4 text-xs font-sans">
        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
            Faculty Full Name *
          </label>
          <input
            type="text"
            [(ngModel)]="facultyNameInput"
            placeholder="e.g. Faculty of Computing & Technology"
            class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900 dark:text-white"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">
            Faculty Code / Abbreviation (Optional)
          </label>
          <input
            type="text"
            [(ngModel)]="facultyCodeInput"
            placeholder="e.g. FCT"
            class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-slate-900 dark:text-white"
          />
        </div>
      </div>

      <!-- Footer Actions -->
      <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-end gap-3">
        <button
          type="button"
          (click)="closeCreateModal()"
          class="px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-semibold rounded-lg transition-colors cursor-pointer"
        >
          Cancel
        </button>

        <button
          type="button"
          (click)="submitCreateFaculty()"
          [disabled]="isSubmitting() || !facultyNameInput().trim()"
          class="px-5 py-2 bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-700 hover:to-indigo-800 text-white text-xs font-bold uppercase tracking-wider rounded-lg shadow-sm transition-all disabled:opacity-50 cursor-pointer flex items-center gap-2"
        >
          @if (isSubmitting()) {
            <span class="animate-spin w-3.5 h-3.5 border-2 border-current border-t-transparent rounded-full"></span>
            <span>Creating...</span>
          } @else {
            <span>Create Faculty Entry</span>
          }
        </button>
      </div>
    </div>
  </div>
}

<!-- REUSABLE CONFIRM DEACTIVATION MODAL -->
<app-confirm-modal
  [isOpen]="isConfirmModalOpen()"
  [icon]="'🏛️'"
  [iconVariant]="'danger'"
  [title]="'Confirm Faculty Soft Deactivation'"
  [message]="'Are you sure you want to soft-deactivate ' + selectedFacultyForDelete()?.name + '? Active student account dependencies will block deactivation.'"
  [confirmIcon]="'🗑️'"
  [confirmText]="'Proceed with Deactivation'"
  [confirmVariant]="'danger'"
  [cancelIcon]="'✕'"
  [cancelText]="'Keep Faculty Active'"
  [isLoading]="isDeactivating()"
  (confirm)="confirmDeactivate()"
  (cancel)="closeDeactivateModal()"
/>
