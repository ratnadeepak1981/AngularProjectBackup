@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-in fade-in duration-150">
    <div class="bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full p-6 border border-slate-200 dark:border-slate-800 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
        <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <span>🛏️</span> {{ roomToEdit ? 'Edit Hostel Room' : 'Create Hostel Room' }}
        </h3>
        <button (click)="onClose()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer">
          ✕
        </button>
      </div>

      <div class="space-y-3">
        @if (!roomToEdit) {
          <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">
              Hostel Building
            </label>
            <select
              [ngModel]="selectedHostelId()"
              (ngModelChange)="selectedHostelId.set($event)"
              class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium"
            >
              @for (h of hostels; track h.id) {
                <option [value]="h.id">{{ h.name }}</option>
              }
            </select>
          </div>
        }

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">
            Room Number / Identifier
          </label>
          <input
            type="text"
            [ngModel]="roomNumber()"
            (ngModelChange)="roomNumber.set($event)"
            placeholder="e.g. R-101"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-mono"
          />
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300">
            Max Student Capacity
          </label>
          <input
            type="number"
            [ngModel]="maxCapacity()"
            (ngModelChange)="maxCapacity.set($event)"
            min="1"
            max="20"
            class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
          />
        </div>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button
          type="button"
          (click)="onClose()"
          class="w-1/2 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-semibold text-xs hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors cursor-pointer"
        >
          Cancel
        </button>
        <button
          type="button"
          (click)="onSubmit()"
          [disabled]="isSubmitting() || !roomNumber().trim() || maxCapacity() <= 0"
          class="w-1/2 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-95 disabled:opacity-50 text-white font-semibold text-xs shadow-md transition-all cursor-pointer"
        >
          @if (isSubmitting()) {
            <span>Saving...</span>
          } @else {
            <span>{{ roomToEdit ? 'Save Changes' : 'Create Room' }}</span>
          }
        </button>
      </div>
    </div>
  </div>
}
