<div class="space-y-4">
  <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-4">
    <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
      <span>🏷️ Fee Types Directory</span>
      <span class="px-2 py-0.5 text-2xs font-semibold bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 rounded-md border border-emerald-200 dark:border-emerald-800">
        {{ feeTypes.length }} Total
      </span>
    </h3>
    <button
      (click)="refresh.emit()"
      class="px-3.5 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold rounded-xl border border-slate-200 dark:border-slate-700 transition-colors cursor-pointer flex items-center gap-1.5 shadow-2xs"
    >
      <span>🔄</span> Refresh Fee Types
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="feeTypes"
    [isLoading]="isLoading"
    [sortIconStyle]="'svg-arrows'"
    [emptyMessage]="'No fee types present. Click &quot;+ Create Fee Type&quot; to register a new category.'"
  >
    <ng-template #cellActions let-row>
      @if (row.isActive) {
        <button
          (click)="toggleStatus.emit(row)"
          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-rose-50 dark:bg-rose-950/60 hover:bg-rose-100 dark:hover:bg-rose-900 text-rose-700 dark:text-rose-300 text-2xs font-semibold border border-rose-200 dark:border-rose-800 transition-colors cursor-pointer shadow-2xs"
        >
          <span>🗑️</span> Deactivate
        </button>
      } @else {
        <button
          (click)="toggleStatus.emit(row)"
          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900 text-emerald-700 dark:text-emerald-300 text-2xs font-semibold border border-emerald-200 dark:border-emerald-800 transition-colors cursor-pointer shadow-2xs"
        >
          <span>🔄</span> Reactivate
        </button>
      }
    </ng-template>
  </app-data-table>
</div>
