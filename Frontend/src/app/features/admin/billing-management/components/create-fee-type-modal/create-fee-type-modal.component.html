@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs animate-fade-in">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 w-full max-w-md overflow-hidden animate-scale-in">
      <!-- Header -->
      <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
        <div class="flex items-center gap-2.5">
          <span class="text-xl">🏷️</span>
          <div>
            <h3 class="text-base font-bold text-slate-900 dark:text-white">Create Fee Type</h3>
            <p class="text-2xs text-slate-500 dark:text-slate-400">Add a new university fee category or lab fine type.</p>
          </div>
        </div>
        <button
          (click)="onClose()"
          class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
        >
          ✕
        </button>
      </div>

      <!-- Body -->
      <div class="p-5 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">
            Fee Type Name <span class="text-rose-500">*</span>
          </label>
          <input
            type="text"
            [ngModel]="feeTypeName()"
            (ngModelChange)="feeTypeName.set($event)"
            placeholder="e.g. Science Lab Equipment Fine"
            class="w-full px-3 py-2 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-900 dark:text-white"
          />
        </div>
      </div>

      <!-- Footer -->
      <div class="p-4 border-t border-slate-200 dark:border-slate-800 flex justify-end items-center gap-2.5 bg-slate-50/50 dark:bg-slate-800/50">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold rounded-xl transition-colors cursor-pointer"
        >
          <span>✕</span> Cancel
        </button>
        <button
          type="button"
          (click)="onSubmit()"
          [disabled]="isSubmitting() || !feeTypeName()"
          class="px-4 py-2 text-xs bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold rounded-xl shadow-sm transition-all cursor-pointer flex items-center gap-1.5"
        >
          @if (isSubmitting()) {
            <span class="animate-spin text-xs">⏳</span> Creating...
          } @else {
            <span>🏷️</span> Create Fee Type
          }
        </button>
      </div>
    </div>
  </div>
}
