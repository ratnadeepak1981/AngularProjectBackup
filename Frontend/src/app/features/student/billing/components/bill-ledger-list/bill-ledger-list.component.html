<div class="space-y-4">
  <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-4">
    <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
      <span>📜 My Fee Payments & Fines Ledger</span>
      <span class="px-2 py-0.5 text-2xs font-semibold bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 rounded-md border border-blue-200 dark:border-blue-800">
        {{ displayItems().length }} Total
      </span>
    </h3>
    <button
      (click)="refresh.emit()"
      class="px-3.5 py-1.5 text-xs bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-semibold rounded-xl border border-slate-200 dark:border-slate-700 transition-colors cursor-pointer flex items-center gap-1.5 shadow-2xs"
    >
      <span>🔄</span> Refresh Ledger
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="displayItems()"
    [isLoading]="isLoading"
    [sortIconStyle]="'svg-arrows'"
    [emptyMessage]="'No fee payments or fines present on your account statement.'"
  >
    <ng-template #cellActions let-row>
      @if (row.isPaid) {
        <button
          (click)="viewReceipt.emit(row)"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900 text-emerald-700 dark:text-emerald-300 text-xs font-semibold border border-emerald-200 dark:border-emerald-800 transition-colors cursor-pointer shadow-2xs"
        >
          <span>📄</span> View Receipt
        </button>
      } @else {
        <button
          (click)="payOnline.emit(row)"
          class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold shadow-sm hover:shadow-md transition-all cursor-pointer"
        >
          <span>Pay Fee Online →</span>
        </button>
      }
    </ng-template>
  </app-data-table>
</div>
